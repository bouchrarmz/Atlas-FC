    <i class="fa-solid fa-trash"></i> pour supprimer.
</p>
    

<div id="popup-joueur" class="  head inset-0 z-50 flex items-center justify-center bg-black/60 p-4">

    <div class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">

        <div class="mb-6 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">
                Ajouter un joueur
            </h2>

            <button type="button"
                class="text-2xl text-slate-400 hover:text-white">
                &times;
            </button>
        </div>

        <form>
            <div class="mb-4">
                <label class="mb-2 block text-sm text-slate-300">
                    Nom complet
                </label>

                <input
                    type="text"
                    placeholder="Ex. Ayoub Mansouri"
                    class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-green-500">
            </div>

            <div class="mb-4">
                <label class="mb-2 block text-sm text-slate-300">
                    Numéro du maillot
                </label>

                <input
                    type="number"
                    placeholder="Ex. 10"
                    class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-green-500">
            </div>

            <div class="mb-6">
                <label class="mb-2 block text-sm text-slate-300">
                    Poste
                </label>

                <select
                    class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-green-500">
                    <option value="">Choisir un poste</option>
                    <option>GB - Gardien</option>
                    <option>DG - Défenseur gauche</option>
                    <option>DC - Défenseur central</option>
                    <option>DD - Défenseur droit</option>
                    <option>MG - Milieu gauche</option>
                    <option>MC - Milieu central</option>
                    <option>MD - Milieu droit</option>
                    <option>BU - Buteur</option>
                </select>
            </div>

            <div class="flex gap-3">
                <button type="button"
                    class="flex-1 rounded-lg bg-slate-700 p-3 font-semibold text-white hover:bg-slate-600">
                    Annuler
                </button>

                <button type="submit"
                    class="flex-1 rounded-lg bg-green-600 p-3 font-semibold text-white hover:bg-green-500">
                    Ajouter
                </button>
            </div>
        </form>

    </div>
